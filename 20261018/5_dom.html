<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red {
            color: red;
        }

        .text {
            background: #ccc;
        }
    </style>
</head>

<body>
    <h1 id="title"><mark>我的</mark>網頁</h1>
    <div id="container">
        <p class="text">第一段文字</p>
        <p class="text">第二段文字</p>
        <p>第三段文字</p>
        <input type="text" hidden>
        <input type="checkbox" checked>

    </div>
    <script>
        const qoo = document.querySelector('.text');
        // qoo.classList.remove('red');
        // qoo.classList.remove('text');
        qoo.classList.remove('red', 'text');
        qoo.classList.add('red');
        qoo.classList.toggle('red');

        qoo.className = 'red text';
        qoo.className = '';



    </script>
</body>

</html>
