<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小節練習</title>
</head>

<body>
    <h1>小節練習</h1>
    <script>

        // 閏年判斷
        const year = 2020;
        const isLeap = ((year % 4 === 0) && (year % 100 !== 0)) || (year % 400 === 0);
        // const isLeap = false;
        // console.log(isLeap)
        console.log(`${year}是閏年:${isLeap}`);

        console.clear
        // BMI 體重狀態

        const height = 170;
        const weight = 70
        const bmi = (weight / (height / 100) ** 2).toFixed(2);

        let result;
        switch (true) {
            case bmi < 18.5: result = '過輕'; break
            case bmi <= 24.9: result = '正常'; break
            case bmi <= 29.9: result = '過重'; break
            default: result = '肥胖'; break
        }

        console.log(`身高${height}cm,體重${weight}kg,bmi${bmi},狀態:${result}`)

    </script>


</body>

</html>
