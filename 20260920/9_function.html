        // 宣告函式
        function createBMI() {
            const height = 170;
            const weight = 70
            const bmi = (weight / (height / 100) ** 2).toFixed(2);

            let result;
            switch (true) {
                case bmi < 18.5: result = '過輕'; break
                case bmi <= 24.9: result = '正常'; break
                case bmi <= 29.9: result = '過重'; break
                default: result = '肥胖'; break
            }
            console.log(`身高${height}cm,體重${weight}kg,bmi${bmi},狀態:${result}`)
        }

        function danymicBMI2({ height, weight, name: userName = 'Noname' }) {
            if (Number.isFinite(height) || !Number.isFinite(weight))
                return `請輸入${userName}身高體重`;
            // } else {
            const bmi = (weight / (height / 100) ** 2).toFixed(2);

            let result;
            switch (true) {
                case bmi < 18.5: result = '過輕'; break
                case bmi <= 24.9: result = '正常'; break
                case bmi <= 29.9: result = '過重'; break
                default: result = '肥胖'; break
            }
            return (`${userName}身高${height}cm,體重${weight}kg,bmi${bmi},狀態:${result}`);
        }
