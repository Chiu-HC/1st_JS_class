<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array 陣列</title>
</head>

<body>
    <script>
        // const fruit1 = 'apple';
        // const frult2 = 'banana';
        // const frult3 = 'cherry';
        // console.log('i buy' + ftuit1 + fruit2 + ftuit3);

        // 陣列，型別為(object)特殊的物件，可以指定多個內容作為一個變數
        // const fruits =[]
        const fruits = ['apple', 'banana', 'cherry', 'grape']; // 陣列宣告
        const ary = [10, 'BB', true, 4, 5];

        const myAry = new Array('apple', 200);

        // console.log(fruits[0]);
        console.clear();
        fruits[2] = 'orange';
        console.log(fruits);
        console.log(fruits.length);

        console.clear();

        const students = ['A', 'B', 'C', 'D', 'E'];
        // for (let i = 0; i < 4; i++);
        // console.log(students[6]);

        for (let i = 0; i < students.length; i++) {
            console.log(students[i]);
        }

        console.clear();
        // 常用，比For迴圈較整潔
        for (let item of students) {
            console.log(item);
        }

        console.clear();
        // 較常用，直接使用 array method來實現
        students.forEach(function (item) {
            console.log(item);
        })


    </script>
</body>

</html>
