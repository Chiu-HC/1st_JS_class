        // 變數/常數，會對映在記憶體中位置存取

        // 陣列存取方式，可透過 .push() .pop() .shift() .unshift()
        // 且會改變陣列本身
        // 陣列實例化 = prototype
        const getLast = animals.pop();
        const getFirst = animals.shift();
        animals.unshift('fish')
        animals.push('fish')
        animals.push('rabbit')

        console.log(getFirst, getLast, animals)
        // .include() 檢查指定內容是否在陣列中 true/false
        // .indexOf() 調查指定內容在索引幾號
        // .lastIndexOf() 同上，從尾巴開始找
        // .reverse() 將當前陣列反轉
        // .sort() 將當前陣列排序
        // .joni() 將當前陣列轉成字串，並且可指定分隔符號

        console.log(`<li>${animals, join}</li>`)
