    <script>
        // Math 物件，提供數學運算的屬性與方法
        console.log(Math.PI); // 圓周率
        console.log(Math.E); // 自然對數的底數

        console.log(Math.round(3.6)); // 四捨五入
        console.log(Math.floor(3.6)); // 無條件捨去
        console.log(Math.ceil(3.6)); // 無條件進位

        console.log(Math.pow(2, 3)); // 次方，2的3次方
        console.log(Math.sqrt(9)); // 開根號，9的平方根

        console.log(Math.abs(-7)); // 絕對值，-5的絕對值

        console.log(Math.max(1, 2, 3, 4, 5)); // 最大值，1~5的最大值
        console.log(Math.min(1, 2, -3, 4, 5)); // 最小值，1~5的最小值

        console.log(Math.random()); // 0~0.99999
        console.log(Math.random() * 10); // 0~9.99999

        console.log(Math.floor(Math.random() * 10)); // 0~9
        console.log(Math.floor(Math.random() * 10) + 1); // 1~10

        console.clear();
