<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Quiz </title>
</head>

<body>
    <script>
        /**
         * 請寫一個 Javascript 程式，計算 並將結果用 console.log輸出
         * "距離今年跨年還有 ${day}天 ${hr}時 ${min}分 ${sec}秒。"
         * 提示：可用Date物件、時間相減、毫秒轉換技巧
         */

        function conuntNewYearEve() {
            let day = 0, hr = 0, min = 0, sec = 0;
            const now = new Date();
            const newYear = new Date(`${now.getFullYear() + 1}-01-01 00:00:00`);
            const diff = Math.floor((newYear - now) / 1000);

            sec = diff % 60;
            min = Math.floor(diff / 60) % 60;
            hr = Math.floor(diff / 60 / 60) % 24;
            day = Math.floor(diff / 60 / 60 / 24);

            // const tmp = Math.floor(diff / 60 / 60) / 24;
            return `距離今年跨年還有 ${day}天 ${hr}時 ${min}分 ${sec}秒。`
        };

        console.log(conuntNewYearEve());












    </script>

</body>

</html>
