<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Stamp </title>
</head>

<body>
    <script>
        const nowStr = Date(); // 當前(電腦)的日期與時間固定字串
        console.log(nowStr); // 普通字串
        console.log(Date.now); // 回傳當前的時間戳記，單位為毫秒

        console.clear();
        const now = new Date(); //建立一個新的日期物件，是一個特別的時間物件

        // const birthday = new Date('2000-08-15 05:10:20'); // +8的方式指定時間
        // const birthday = new Date(2000, 7, 15, 5, 10, 20); // +8的方式指定年月日時分秒
        const birthday = new Date('2000-10-04T00:00:00Z'); //UTC (+0)時間指定

        console.log(typeof nowStr, typeof now);
        console.log(birthday);

        console.clear();
        console.log(now);

        const MonthTW = ['一月', '二月']
        const DayTW = ['星期天', '星期一']

        console.log(MonthTW[now.getMonth()]);
        // console.log(MonthEN[now.getMonth()]);
        console.log(DayTW[now.getDay()]);

        /**
 * getFullYear()：取得年份
 * getMonth()：取得月份（0~11）
 * getDate()：取得日期（1~31）
 * getDay()：取得星期（0~6，0 代表星期日）
 * getHours()：取得小時
 * getMinutes()：取得分鐘
 * getSeconds()：取得秒數
 * getTime()：取得自 1970/1/1 00:00:00 UTC 以來的「時間戳記」（Timestamp，單位為毫秒，millisecond）
 * toLocaleString()：格式化日期字串，會根據瀏覽器用戶的地區（Locale）自動顯示對應的日期與時間格式
 */

        console.clear();

        const date1 = new Date('2023-10-01');
        const date2 = new Date('2023-10-04');

        const date1Time = date1.getTime();
        const date2Time = date2.getTime();
        const diff = date2Time - date1Time;

        const diffDay = diff / 1000 / 60 / 60 / 24;

        console.log(diffDay, '天');

        console.clear();

        const theDate = new Date(); //產生靜止的時間物件
        console.log(theDate);

        // theDate.setFullYear(2028);
        // theDate.setDate(25);
        // console.log(theDate);

        // Q: 請將時間調到28天後
        // theDate.setDate(theDate.getDate() + 28);
        // console.log(theDate);

        // Q: 請將時間調到4天前
        theDate.setDate(theDate.getDate() - 4);
        console.log(theDate);




    </script>

</body>

</html>
